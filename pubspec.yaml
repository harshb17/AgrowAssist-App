name: agroassist
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.11.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.0.4
  image: ^4.0.17
  url_launcher: ^6.1.10
  fl_chart: ^0.70.2
  animated_splash_screen: ^1.3.0
  page_transition: ^2.0.9
  lottie: ^2.3.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/banner.png
    - assets/logo.png
    - assets/crop_recommendation.tflite
    - assets/plant_disease_model.tflite
    - assets/disease_data.json
    - assets/fruit_data.json
    - assets/labels.txt
    - assets/fruit_vegetable_classifier_quantized.tflite
    - assets/fruit_vegetable_healty_classifier.tflite
    - assets/class_names.txt

  # fonts:
  #   - family: YourFont
  #     fonts:
  #       - asset: fonts/your_font.ttf
